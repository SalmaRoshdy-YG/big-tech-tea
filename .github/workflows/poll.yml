name: poll

on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours, offset off the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Match and summarise, but send nothing"
        type: boolean
        default: false

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write               # to commit state/ and docs/data/ back

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run big-tech-tea
        env:
          # Leave SUMMARIZER unset for the free, offline heuristic summariser.
          # To use an LLM, set these as repository secrets/variables. Any
          # OpenAI-compatible endpoint works; several have free tiers.
          SUMMARIZER: ${{ vars.SUMMARIZER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MAX_CALLS: ${{ vars.LLM_MAX_CALLS || '25' }}
          # Only needed for protected topics on a self-hosted ntfy server.
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # Keeps a channel out of a public repo. In your subscription file use
          #   ntfy_topic_env: NTFY_TOPIC_MINE
          # and add NTFY_TOPIC_MINE under Settings > Secrets and variables >
          # Actions. Add one line here per person who wants a private channel.
          NTFY_TOPIC_MINE: ${{ secrets.NTFY_TOPIC_MINE }}
        run: |
          python -m bigtechtea.cli run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state and digest
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "big-tech-tea[bot]"
          git config user.email "big-tech-tea@users.noreply.github.com"
          git add state/ docs/data/
          git diff --staged --quiet || git commit -m "chore: refresh alerts state and digest"
          git push
